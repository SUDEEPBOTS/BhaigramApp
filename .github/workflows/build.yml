name: Build Bhaigram APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK & CMake
        run: |
          echo "y" | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Afat Release APK
        if: "${{ github.event.inputs.build_type != 'debug' }}"
        run: ./gradlew :TMessagesProj_App:assembleAfatRelease --stacktrace

      - name: Build Afat Debug APK
        if: "${{ github.event.inputs.build_type == 'debug' }}"
        run: ./gradlew :TMessagesProj_App:assembleAfatDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BhaigramApp-APK
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
          retention-days: 14
